   <g id="text_1">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="36" y="45.484762" transform="rotate(-0 36 45.484762)">Existing bird classifiers fail on phone audio.</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="36" y="149.855962" transform="rotate(-0 36 149.855962)">So why does accuracy collapse on phones?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="36" y="214.828874" transform="rotate(-0 36 214.828874)">We find that the microphone, not the bird, causes the drop.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #b52d24" x="471.6" y="34.904634" transform="rotate(-0 471.6 34.904634)">Lead sentence</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 51.631274)">States the point. Read alone,</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 63.059253)">it gives the whole paragraph.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #60645e" x="471.6" y="97.112409" transform="rotate(-0 471.6 97.112409)">Body</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 113.839274)">Backs the point: a number,</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 125.267253)">an example, a citation.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="471.6" y="147.224409" transform="rotate(-0 471.6 147.224409)">Bridge sentence</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 163.951274)">Raises the question that the</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(471.6 175.379253)">next paragraph answers.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #b52d24" x="471.6" y="204.248634" transform="rotate(-0 471.6 204.248634)">Next lead</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="471.6" y="220.188287" transform="rotate(-0 471.6 220.188287)">Answers it at once.</text>
   </g>
