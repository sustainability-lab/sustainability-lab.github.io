   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="36" y="37.305469" transform="rotate(-0 36 37.305469)">Intuition first</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="36" y="58.517183" transform="rotate(-0 36 58.517183)">“Reading heat is a chain of steps. We test each link alone, so a failure shows where the chain breaks.”</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #60645e" x="32.4" y="115.858496" transform="rotate(-0 32.4 115.858496)">Step 1</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="32.4" y="141.446572" transform="rotate(-0 32.4 141.446572)">Is it a thermal image?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #60645e" x="262.8" y="115.858496" transform="rotate(-0 262.8 115.858496)">Step 2</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="262.8" y="141.44668" transform="rotate(-0 262.8 141.44668)">Can it read the colour bar?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #60645e" x="493.2" y="115.858496" transform="rotate(-0 493.2 115.858496)">Step 3</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #222522" x="493.2" y="141.44668" transform="rotate(-0 493.2 141.44668)">Can it reason about heat?</text>
   </g>
   <g id="text_9">
    <text style="font-style: italic; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: start; fill: #60645e" x="21.6" y="180" transform="rotate(-0 21.6 180)">Inside every step, the same four beats:</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: middle; fill: #222522" x="97.2" y="240.834741" transform="rotate(-0 97.2 240.834741)">Why</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(45.832031 288.398525)">one sentence on what</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(65.686875 301.276201)">the step is for</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: middle; fill: #222522" x="270" y="240.834741" transform="rotate(-0 270 240.834741)">Toy example</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(225.057539 288.414111)">2–4 sentences with</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(222.158555 301.214678)">real (small) numbers</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: middle; fill: #222522" x="442.8" y="240.834863" transform="rotate(-0 442.8 240.834863)">How</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(404.278945 288.398525)">short bullets and</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(412.441055 301.212217)">one equation</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; text-anchor: middle; fill: #222522" x="615.6" y="240.834863" transform="rotate(-0 615.6 240.834863)">Guarantee</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(570.068555 287.416611)">one plain sentence;</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans'; fill: #222522" transform="translate(556.649883 301.214678)">the proof goes elsewhere</text>
   </g>
