on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      #- name: Set up R
      #  uses: r-lib/actions/setup-r@v2

      #- name: Install packages
      #  uses: r-lib/actions/setup-r-dependencies@v2
      #  with:
      #    packages: |
      #      any::htmltools
      #      any::yaml

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to the version the site is built and checked with locally
          # (listing templates and theming were verified on 1.4.554).
          version: 1.4.554

      # The lab film is too large for git; it lives as an asset on the `film` release
      # (see _film/README.md) and is copied into images/film/ before rendering.
      - name: Fetch the lab film
        run: gh release download film --pattern lab-film.mp4 --dir images/film --clobber || echo "No film release yet"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
