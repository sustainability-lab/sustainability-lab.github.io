project:
  type: website
  output-dir: docs
  resources:
    - images/**
    - events/acm-summer-2025/
    - flyer.pdf

website:
  title: "Sustainability Lab"
  site-url: https://sustainability-lab.github.io
  description: "AI-driven research for a sustainable future at IIT Gandhinagar, led by Prof. Nipun Batra. PhD, postdoc, and internship openings in AI for sustainability, health sensing, energy analytics, and environmental monitoring."
  favicon: /images/favicon-sl.svg
  image: /images/logo.png
  open-graph: true
  twitter-card:
    creator: "@nipun_batra"
    card-style: summary_large_image
  navbar:
    title: false
    logo: /images/brand/logo-light.svg
    logo-alt: "Sustainability Lab"
    search: true
    right:
      - text: Research
        href: research.qmd
      - text: Publications
        href: papers/index.qmd
      - text: People
        href: people.qmd
      - text: Join
        href: join.qmd
      - text: Handbook
        href: handbook/index.qmd
      - text: News
        href: news.qmd
  page-footer:
    left: |
      © 2026 Sustainability Lab, IIT Gandhinagar<br>
      [nipun.batra@iitgn.ac.in](mailto:nipun.batra@iitgn.ac.in) · [Lab flyer](/flyer.pdf)
    center: |
      [Lab YouTube](https://www.youtube.com/@SustainabilityLab-SL) ·
      [Teaching YouTube](https://www.youtube.com/@NipunBatra0) ·
      [X](https://x.com/nipun_batra) ·
      [LinkedIn](https://www.linkedin.com/in/nipunbatra0/) ·
      [GitHub](https://github.com/sustainability-lab)
    right: |
      Supported by Google, Cisco, NVIDIA, Microsoft, SERB/ANRF, MoES, DST, STARS, GUJCOST, CoE in AI (MHRD), Gujarat Forest Dept. and Jio

format:
  html:
    theme:
      light: [default, theme/light.scss, theme/legacy.scss, theme/site.scss]
      dark: [default, theme/dark.scss, theme/legacy.scss, theme/site.scss]
    toc: false
    page-layout: full
    highlight-style: a11y
    code-copy: true
    code-overflow: wrap
    date-format: "MMMM D, YYYY"
    include-after-body: theme/toggle.html
    include-in-header:
      text: |
        <script>
        // Follow the OS light/dark setting until someone uses the switch (see theme/toggle.html).
        try { if (!localStorage.getItem("lab-theme-chosen")) localStorage.setItem("quarto-color-scheme", window.matchMedia("(prefers-color-scheme: dark)").matches ? "alternate" : "default"); } catch (e) {}
        </script>

execute:
  freeze: auto
